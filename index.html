<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus objetivos do ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Meus jogos favoritos<span>_</span></h2>
        <div class="conteudo">
            <div class="botoes">
                <button class="botao ativo">Don't Starve</button>
                <button class="botao">Assassin's Creed IV</button>
                <button class="botao">God of War</button>
                <button class="botao">League of Legends</button>
            </div>
            <div class="abas-textos">
                <div class="aba-conteudo ativo">
                    <h3 class="aba-conteudo-titulo-principal">É um jogo de sobrevivência e fantasia.</h3>
                    <p align="center">
                    <img src="img/dontstarve.jpg" alt="Don't Starve">
                </p>
                    <h4 class="aba-conteudo-titulo-secundario">Saiba mais acessando:</h4>
                    </div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">É um jogo de piratas saqueadores.</h3>
                    <p align="center">
                    <img src="img/aciv.jpeg" alt="Assassin's Creed Black Flag"
                    </p>
                    <h4 class="aba-conteudo-titulo-secundario">Saiba mais acessando:</h4>
                    </div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">É um jogo sobre deuses.</h3>
                    <p align="center">
                    <img src="img/godofwar.jpg" alt="God of War"
                    </p>
                    <h4 class="aba-conteudo-titulo-secundario">Saiba mais acessando:</h4>
                    </div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">É o melhor jogo da história.</h3>
                    <p align="center">
                    <img src="img/leagueoflegends.png" width = "300" alt="League of Legends">
                    </p>
                    <h4 class="aba-conteudo-titulo-secundario">Saiba mais acessando:</h4>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="main.js"></script>
</body>

</html>
